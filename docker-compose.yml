      ENVIRONMENT: prod
      GRPC_CLIENT_TLS: ${GRPC_CLIENT_TLS}
      DB_ENDPOINT: postgres://${EDMS_DB_USER}:${EDMS_DB_PASSWORD}@postgresql:5432/${EDMS_DB_NAME}?sslmode=disable
      SSO_ENDPOINT: sso-server:10080
      AUDIT_LOG_ENDPOINT: audit-log:10080
      SPICEDB_TOKEN: ${SPICEDB_TOKEN}
      SPICEDB_ENDPOINT: spicedb:50051
    command:
      - /bin/sh
      - -ec
      - |
        echo 'Start full sync access'
        # Just keep it alive for ofelia to exec into
        tail -f /dev/null
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.edms-access-full-sync.no-overlap: "true"
      ofelia.job-exec.edms-access-full-sync.schedule: ${EDMS_ACCESS_FULL_SYNC_SCHEDULE}
      ofelia.job-exec.edms-access-full-sync.command: "./edms-access-full-sync"
    networks:
      - persist
      - apps
    restart: unless-stopped

  ofelia:
    image: ${DOCKER_IMAGE_REGISTRY}/mcuadros_ofelia:0.3.22
    logging: *default-logging
    depends_on:
      previewer-server:
        condition: service_started
      searchp-server:
        condition: service_started
      edms-access-full-sync:
        condition: service_started
      previewer-cleaner:
        condition: service_started
      pdf-text-storage-watcher:
        condition: service_started
    command: [ "daemon", "--docker" ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  edms-db-migrations:
    image: ${DOCKER_IMAGE_REGISTRY}/edms-server:${EDMS_SERVER_IMAGE_TAG}
    logging: *default-logging
    profiles: [ "migrate" ]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB_ENDPOINT: postgres://${EDMS_DB_USER}:${EDMS_DB_PASSWORD}@postgresql:5432/${EDMS_DB_NAME}?sslmode=disable
      SSO_ENDPOINT: sso-server:10080
      AUDIT_LOG_ENDPOINT: audit-log:10080
      S3_ENDPOINT: http://minio:9000
      S3_AKID: ${S3_AKID}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${MINIO_REGION}
      S3_REVISIONS_BUCKET: ${MINIO_EDMS_BUCKET}
      BROKER_TOPIC: ${REDPANDA_TOPIC}
      BROKER_GROUP_ID: edms-migrate
      BROKER_BUFFER: "10000"
    command:
      - sh
      - -ec
      - |
        cd /app
        ./edms-migrations
    restart: "no"
    networks:
      - persist

  caddy:
    image: ${DOCKER_IMAGE_REGISTRY}/gateway-kkmp:${CADDY_IMAGE_TAG}
    logging: *default-logging
    depends_on:
      keycloak:
        condition: service_started
      edms-front:
        condition: service_started
      sso-front:
        condition: service_started
      previewer-front:
        condition: service_started
      search-panel:
        condition: service_started
    command: [ "caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile" ]
    environment:
      FILEMASTER_DOMAIN: ${FILEMASTER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/overrides:/etc/caddy/overrides:ro
      - ./caddy/cert:/tls:ro
    networks:
      - apps
    restart: unless-stopped

networks:
  persist:
    driver: bridge
  apps:
    driver: bridge

volumes:
  postgresql_data:
  minio_data:
  rabbitmq_data:
  redpanda_data:
  elasticsearch_data:
  redis_data:
  searchp_cache:
