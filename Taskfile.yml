version: '3'

includes:
  reposync:
    taskfile: ./Taskfile.reposync.yml
    optional: true
    flatten: true
  standby:
    taskfile: ./Taskfile.standby.yml
    optional: true
    flatten: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task -l

  fm-install:
    desc: Install the fm renderer binary for this delivery
    dir: '{{.TASKFILE_DIR}}'
    vars:
      DOCKER_IMAGE_REGISTRY: '{{default "cr.yandex/crp3hlk59bl8bqcmkevi" .DOCKER_IMAGE_REGISTRY}}'
    cmds:
      - |
        set -eu

        registry='{{.DOCKER_IMAGE_REGISTRY}}'
        registry="${registry%/}"

        artifact_path="$(awk '/^[[:space:]]*ref:[[:space:]]*/ { print $2; exit }' .fm-release.yml)"
        if [ -z "$artifact_path" ]; then
          echo "Error: .fm-release.yml does not define fm.artifact.ref" >&2
          exit 1
        fi
        artifact_host="${artifact_path%%/*}"
        artifact_ref="$registry/$artifact_path"
        oras_image="$registry/oras:v1.3.2"

        tmp="./.fm-install.tmp"
        rm -rf "$tmp"
        mkdir -p "$tmp"
        trap 'rm -rf "$tmp"' EXIT

        docker run --rm \
          -v "$PWD/$tmp:/out" \
          -u $(id -u):$(id -g) \
          "$oras_image" \
          pull "$artifact_ref" --output /out

        if [ ! -f "$tmp/fm" ]; then
          echo "Error: artifact $artifact_ref did not contain a file named fm" >&2
          exit 1
        fi

        chmod 0755 "$tmp/fm"
        mv -f "$tmp/fm" ./fm

  config-render:
    desc: Render Filemaster configuration
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./fm config render

  check-config:
    desc: Render configuration and validate Docker Compose
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./fm config render
      - docker compose config >/dev/null

  persistence-start:
    desc: Start the persistence layer
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose up -d postgresql minio rabbitmq redpanda elasticsearch redis

  persistence-bootstrap:
    desc: Bootstrap persistence data and consumer accounts
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose run --rm postgresql-bootstrap
      - docker compose run --rm minio-bootstrap
      - docker compose run --rm rabbitmq-bootstrap
      - docker compose run --rm redpanda-bootstrap

  keycloak-start:
    desc: Start Keycloak
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose up -d keycloak

  keycloak-bootstrap:
    desc: Apply the Keycloak realm import
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose run --rm keycloak-bootstrap
      - docker compose run --rm keycloak-group-import

  app-migrations:
    desc: Run application database migrations
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose run --rm edms-db-migrations
      - docker compose run --rm previewer-db-migrations
      - docker compose run --rm pdf-text-storage-db-migrations
      - docker compose run --rm audit-log-db-migrations
      - docker compose run --rm spicedb-db-migrations

  app-start:
    desc: Start the application, scheduler, and gateway services
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose up -d sso-server sso-front edms-server edms-front edms-notifications audit-log previewer-front previewer-server previewer-listener previewer-job-worker pdf-text-storage-server pdf-text-storage-worker pdf-text-storage-watcher searchp-server searchp-edms-listener search-panel chat-panel spicedb unoserver ofelia caddy

  searchp-full-index:
    desc: Run the full search index (waits unless DETACH=-d); aborts a previous run
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    vars:
      DETACH: '{{.DETACH | default ""}}'
      CONTAINER: edms-searchp-full-indexer
    cmds:
      - docker rm -f {{.CONTAINER}} >/dev/null 2>&1 || true
      - docker compose run {{.DETACH}} --name {{.CONTAINER}} --rm --no-deps searchp-server ./searchp-indexer-with-lock.sh full-index

  users-access-sync:
    desc: Sync SSO users/groups from Keycloak, then access into SpiceDB
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - config-render
    cmds:
      - docker compose run --rm sso-users-sync
      - docker compose run --rm --entrypoint ./edms-access-full-sync edms-access-full-sync

  bootstrap:
    desc: Start the full EDMS stack in phases
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ./fm secrets sync
      - ./fm secrets fill-empty
      - ./fm config render
      - task persistence-start
      - task persistence-bootstrap
      - task keycloak-start
      - task keycloak-bootstrap
      - task app-migrations
      - task app-start
      - task: searchp-full-index
        vars:
          DETACH: "-d"

  secrets-rotate:
    desc: Rotate installation secrets on a running stack
    dir: '{{.TASKFILE_DIR}}'
    prompt: This replaces every installation secret and restarts services that read them. Continue?
    cmds:
      - ./fm secrets rotate

  wipe:
    desc: Stop the stack and remove named volumes
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - docker compose down -v --remove-orphans

  db-dump:
    desc: Dump all PostgreSQL databases and roles (OUT=path, default backups/pg-dumpall-TIMESTAMP.sql)
    dir: '{{.TASKFILE_DIR}}'
    silent: true
    vars:
      OUT: '{{.OUT | default ""}}'
    cmds:
      - |
        set -eu
        set -o pipefail
        out='{{.OUT}}'
        if [ -z "$out" ]; then
          mkdir -p backups
          out="backups/pg-dumpall-$(date +%Y%m%d-%H%M%S).sql"
        else
          mkdir -p "$(dirname -- "$out")"
        fi
        if ! docker compose exec -T postgresql pg_isready -U postgres >/dev/null 2>&1; then
          echo "Error: postgresql is not ready; start it first (docker compose up -d postgresql)" >&2
          exit 1
        fi
        # pg_dumpall --clean emits DROP/CREATE ROLE for the session user (postgres).
        # Restoring as that user cannot DROP it, and CREATE then fails with "already exists".
        # Keep ALTER ROLE so password/attributes are still restored.
        docker compose exec -T postgresql \
          sh -ec 'export PGPASSWORD="${POSTGRES_PASSWORD:-${POSTGRESQL_PASSWORD:-}}"; pg_dumpall -U postgres --clean --if-exists' \
          | sed -E \
            -e '/^DROP ROLE( IF EXISTS)? ["'\'']?postgres["'\'']?;/d' \
            -e '/^CREATE ROLE ["'\'']?postgres["'\'']?;/d' \
          > "$out"
        echo "Wrote $out"

  db-restore:
    desc: Restore PostgreSQL from a pg_dumpall SQL file (IN=path)
    dir: '{{.TASKFILE_DIR}}'
    prompt: This replaces all PostgreSQL databases and roles from the dump file. Continue?
    vars:
      IN: '{{.IN | default ""}}'
    cmds:
      - |
        set -eu
        in='{{.IN}}'
        if [ -z "$in" ]; then
          echo "Error: set IN=path/to/pg-dumpall.sql" >&2
          exit 1
        fi
        if [ ! -f "$in" ]; then
          echo "Error: dump file not found: $in" >&2
          exit 1
        fi
        if ! docker compose exec -T postgresql pg_isready -U postgres >/dev/null 2>&1; then
          echo "Error: postgresql is not ready; start it first (docker compose up -d postgresql)" >&2
          exit 1
        fi
        docker compose exec -T postgresql \
          sh -ec 'export PGPASSWORD="${POSTGRES_PASSWORD:-${POSTGRESQL_PASSWORD:-}}"; psql -U postgres -d postgres -v ON_ERROR_STOP=1' \
          < "$in"
        echo "Restored $in"

  release-list:
    desc: List Filemaster Delivery Release tags
    dir: '{{.TASKFILE_DIR}}'
    silent: true
    cmds:
      - git ls-remote --tags --refs origin | sed 's#^.*refs/tags/##' | sort -V

  release-checkout:
    desc: Check out a Filemaster Delivery Release tag (RELEASE=name, default newest)
    dir: '{{.TASKFILE_DIR}}'
    silent: true
    vars:
      RELEASE: '{{.RELEASE | default ""}}'
    cmds:
      - |
        set -eu
        git fetch origin --tags --force
        tags="$(git ls-remote --tags --refs origin | sed 's#^.*refs/tags/##' | sort -V)"
        if [ -z "$tags" ]; then
          echo "Error: no Delivery Release tags on origin" >&2
          exit 1
        fi
        release='{{.RELEASE}}'
        if [ -z "$release" ]; then
          release="$(printf '%s\n' "$tags" | tail -n1)"
        elif ! printf '%s\n' "$tags" | grep -Fxq -- "$release"; then
          echo "Error: Delivery Release tag not found on origin: $release" >&2
          exit 1
        fi
        git checkout "$release"
        echo "Checked out $release"

  repo-sync:
    cmds:
      - task: copy-bara-sync
